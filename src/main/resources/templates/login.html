<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Skydive Club — Вход</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:linear-gradient(180deg,#f8fafc,#eef6ff);
            font-family:system-ui,-apple-system,Segoe UI,Roboto;
        }

        .auth-card{
            width:100%;
            max-width:420px;
            border-radius:22px;
            overflow:hidden;
            background:rgba(255,255,255,.92);
            backdrop-filter:blur(14px);
            box-shadow:0 20px 50px rgba(15,23,42,.12);
        }

        .auth-header{
            background:linear-gradient(135deg,#38bdf8,#0ea5e9);
            color:#fff;
            padding:26px 20px;
            text-align:center;
        }

        .auth-icon{
            font-size:2rem;
            margin-bottom:8px;
        }

        .auth-subtitle{
            font-size:.9rem;
            opacity:.9;
        }

        .auth-input{
            border-radius:14px;
            padding:10px 14px;
            border:1px solid #e2e8f0;
        }

        .auth-input:focus{
            border-color:#38bdf8;
            box-shadow:0 0 0 3px rgba(56,189,248,.15);
        }

        .auth-btn{
            background:#38bdf8;
            border:none;
            padding:10px;
            border-radius:14px;
            font-weight:700;
            color:#fff;
        }

        .auth-btn:hover{
            background:#0ea5e9;
        }

        .google-btn{
            border:1px solid #e2e8f0;
            background:#fff;
            border-radius:14px;
            padding:10px;
            font-weight:600;
            color:#334155;
        }

        .google-btn:hover{
            background:#f8fafc;
        }

        .auth-link{
            color:#0284c7;
            text-decoration:none;
            font-weight:600;
        }

        .auth-link:hover{
            text-decoration:underline;
        }

        .back-btn{
            position:absolute;
            top:20px;
            left:20px;

            border:none;
            background:#fff;
            border-radius:12px;
            padding:8px 12px;

            box-shadow:0 6px 18px rgba(0,0,0,.08);
            font-weight:600;
            color:#334155;
        }

        .back-btn:hover{
            background:#f8fafc;
        }
    </style>
</head>

<body>

<!-- BACK -->
<a class="back-btn" th:href="${backUrl}">
    ← Назад
</a>

<!-- CARD -->
<div class="auth-card">

    <!-- HEADER -->
    <div class="auth-header">
        <div class="auth-icon">
            <i class="bi bi-box-arrow-in-right"></i>
        </div>
        <h4 class="mb-0">Вход</h4>
        <div class="auth-subtitle">Skydive Club</div>
    </div>

    <!-- BODY -->
    <div class="p-4">

        <!-- ERROR -->
        <div th:if="${param.error}" class="alert alert-danger">
            Неверное имя пользователя или пароль.
        </div>

        <!-- FORM -->
        <form method="post" th:action="@{/login}">

            <div class="mb-3">
                <label class="form-label">Логин</label>
                <input type="text" name="username" class="form-control auth-input" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Пароль</label>
                <input type="password" name="password" class="form-control auth-input" required>
            </div>

            <button type="submit" class="auth-btn w-100">
                Войти
            </button>

        </form>

        <div class="text-center mt-3">
            <a class="auth-link"  th:href="${registerUrl}">
                Нет аккаунта? Регистрация
            </a>
        </div>
    </div>

</div>

</body>
</html>
